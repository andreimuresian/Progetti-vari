name: Build Aria for Windows

on:
  push:
    branches: [main]
    paths:
      - 'aria/**'
      - 'tools/make_icon.py'
      - '.github/workflows/build-aria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Regenerate the icon from source
        run: python tools/make_icon.py

      - name: Build Aria.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Aria
          --icon aria/icon.ico
          --version-file aria/version_info.txt
          --add-data "aria/web;web"
          --add-data "aria/icon.ico;."
          aria/aria.py

      # Launch the executable exactly as the user will, and check that it
      # serves its interface and successfully installs yt-dlp and ffmpeg.
      - name: Smoke test the executable
        run: |
          $env:ARIA_NO_BROWSER = "1"
          $app = Start-Process -FilePath "dist\Aria.exe" -PassThru
          try {
            $base = "http://127.0.0.1:8756"

            $up = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                if ((Invoke-RestMethod "$base/api/ping" -TimeoutSec 5).app -eq "Aria") { $up = $true; break }
              } catch { }
            }
            if (-not $up) { throw "Aria.exe never answered on $base" }
            Write-Host "server is up"

            $page = (Invoke-WebRequest "$base/" -TimeoutSec 10).Content
            if ($page -notmatch 'id="url"')      { throw "the interface did not render" }
            if ($page -match '__ARIA_TOKEN__')   { throw "the session token was not injected" }
            Write-Host "interface renders"

            $token = [regex]::Match($page, 'const TOKEN = "([0-9a-f]+)"').Groups[1].Value
            $headers = @{ "X-Aria-Token" = $token }

            $ready = $false
            foreach ($i in 1..60) {
              $state = Invoke-RestMethod "$base/api/state" -Headers $headers -TimeoutSec 15
              if ($state.setup.state -eq "error") { throw "tool setup failed: $($state.setup.error)" }
              if ($state.setup.state -eq "ready") { $ready = $true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $ready) { throw "yt-dlp / ffmpeg were not installed in time" }
            Write-Host "yt-dlp and ffmpeg installed"

            $bin = Join-Path $env:LOCALAPPDATA "Aria\bin"
            & "$bin\yt-dlp.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "bundled yt-dlp does not run" }
            & "$bin\ffmpeg.exe" -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "bundled ffmpeg does not run" }

            try { Invoke-RestMethod "$base/api/quit" -Method Post -Headers $headers -TimeoutSec 5 } catch { }
            Write-Host "smoke test passed"
          }
          finally {
            Start-Sleep -Seconds 2
            taskkill /F /T /PID $app.Id 2>&1 | Out-Null
          }

      - name: Show the build log if anything failed
        if: failure()
        run: Get-Content "$env:LOCALAPPDATA\Aria\aria.log" -Tail 60 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-windows
          path: dist/Aria.exe

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Continue"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $built = (Get-Date).ToString("yyyy-MM-dd HH:mm") + " UTC"
          $lines = @(
            '**Download `Aria.exe` just below, then double-click it.** Nothing to install.',
            '',
            'The first time, Windows shows a blue *Windows protected your PC* box, because the file',
            'is not signed by a paid certificate. Click **More info**, then **Run anyway**.',
            'It only asks once.',
            '',
            "Built from commit $sha on $built."
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

          Write-Host "creating the release if it does not exist yet"
          gh release create latest --repo $env:REPO --title "Aria - latest version" --notes-file release-notes.md
          Write-Host "create exited with $LASTEXITCODE (non-zero simply means it already existed)"

          Write-Host "uploading Aria.exe"
          gh release upload latest dist/Aria.exe --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload Aria.exe to the release" }

          gh release edit latest --repo $env:REPO --notes-file release-notes.md
          Write-Host "published"
